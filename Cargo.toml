[package]
name = "raptrix-psse-rs"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Raptrix PowerFlow <dev@raptrix.com>"]
license = "MPL-2.0"
description = "High-performance PSS/E (.raw + .dyr) -> Raptrix PowerFlow Interchange v0.10.0 converter"
repository = "https://github.com/RaptrixPowerFlow/raptrix-psse-rs"
keywords = ["psse", "power-systems", "converter", "raptrix", "cim"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
anyhow = "1.0"
arrow = "58.0"
chrono = { version = "0.4", default-features = true }
clap = { version = "4", features = ["derive"] }
# Use the public raptrix-cim-rs implementation (CIM is canonical).
# Previously this repo contained an embedded `raptrix-cim-arrow` crate.
# The canonical source is the IEC 61970 CIM implementation at GitHub;
# depend on the public repository instead of a local path.
#
# NOTE: For local development, the `[patch]` section below redirects this git
# dependency at the local `../raptrix-cim-rs` checkout. For published releases,
# pin a fresh `rev` (or crates.io version) after each schema bump.
raptrix-cim-arrow = { git = "https://github.com/RaptrixPowerFlow/raptrix-cim-rs", rev = "b08d841a6c731e2df6d56cdff6d06dba8ced4e26" }

# Local development override: point `raptrix-cim-arrow` at the sibling repo so
# in-progress schema work compiles and tests end-to-end without round-tripping
# through GitHub. Remove this block (or update the git rev above) before publishing.
[patch."https://github.com/RaptrixPowerFlow/raptrix-cim-rs"]
raptrix-cim-arrow = { path = "../raptrix-cim-rs/raptrix-cim-arrow" }

[dev-dependencies]
# Golden-file integration tests depend on the raptrix-cim-arrow reader.
tempfile = "3.8"

[profile.release]
opt-level = 3
# Link-time optimization for best runtime performance
lto = true
# Fewer codegen units yields better optimizations at the cost of slower compile
codegen-units = 1
debug = false
incremental = false
